name: Test Called Workflow

on:
  workflow_call:
    inputs:
      opentofu_test_args:
        description: "Additional arguments to pass to the tofu test command"
        required: false
        type: string
        default: ""
      opentofu_test_verbose:
        description: "Whether to run tofu test with verbose output"
        required: false
        type: boolean
        default: false
      opentofu_version:
        description: "The version of OpenTofu to use"
        required: true
        type: string
      working_directory:
        description: "The working directory containing the OpenTofu configuration to test"
        required: false
        type: string
        default: .

      # Uncomment if you have private modules

      # ssh_key:
      #   required: true

    secrets:
      opentofu_test_secret_args:
        description: "Additional secret arguments to pass to the tofu test command"
        required: false

permissions:
  contents: read

# If you use private modules, you'll need this env variable to use
# the same ssh-agent socket value across all jobs & steps.

# env:
#  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

jobs:
  test:
    name: OpenTofu
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      # GitHub - Checkout
      # https://github.com/marketplace/actions/checkout

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub - Setup SSH for private module access
      # Uncomment if you have private modules

      # - name: Private module access
      #   run: |
      #     ssh-agent -a $SSH_AUTH_SOCK
      #     mkdir -p ~/.ssh
      #     echo "${{ secrets.ssh_key }}" | tr -d '\r' | ssh-add -
      #     ssh-keyscan github.com >> ~/.ssh/known_hosts

      # Setup OpenTofu
      # https://github.com/marketplace/actions/opentofu-setup-tofu

      - name: OpenTofu setup
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.opentofu_version }}

      - name: OpenTofu format
        run: tofu fmt -check -diff

      - name: OpenTofu initialize
        run: tofu init

      - name: OpenTofu validate
        run: tofu validate

      - name: OpenTofu test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          tofu test --verbose=${{ inputs.opentofu_test_verbose }} -no-color ${{ inputs.opentofu_test_args }} ${{ secrets.opentofu_test_secret_args }} 2>&1 | tee "$RUNNER_TEMP/tofu-test.txt"
          exit ${PIPESTATUS[0]}

      - name: OpenTofu summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          output_file="$RUNNER_TEMP/tofu-test.txt"
          if [ ! -f "$output_file" ] || ! grep -q '[^[:space:]]' "$output_file"; then
            exit 0
          fi

          escape_markdown() {
            printf '%s' "$1" | sed 's/[`|\\]/\\&/g'
          }

          error_line="$(grep -m1 -E 'Error:.+' "$output_file" || true)"
          current_file=''
          runs=()

          while IFS= read -r line; do
            if [[ "$line" =~ ^([^[:space:]]+\.tftest\.hcl)\.\.\. ]]; then
              current_file="${BASH_REMATCH[1]}"
            fi
            if [[ "$line" =~ ^[[:space:]]+run\ \"(.+)\"\.\.\.\ (pass|fail) ]] && [ -n "$current_file" ]; then
              runs+=("${BASH_REMATCH[2]}|${current_file}|${BASH_REMATCH[1]}")
            fi
          done < "$output_file"

          {
            echo '<picture><source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/opentofu/brand-artifacts/main/full/transparent/PNG/on-dark.png"><img src="https://raw.githubusercontent.com/opentofu/brand-artifacts/main/full/transparent/PNG/on-light.png" height="24"></picture>'
            echo

            if [ ${#runs[@]} -gt 0 ]; then
              echo '| Result | File | Run |'
              echo '|---|---|---|'
              for entry in "${runs[@]}"; do
                IFS='|' read -r result file run_name <<< "$entry"
                icon='❌'
                if [ "$result" = 'pass' ]; then
                  icon='✅'
                fi
                escaped_file="$(escape_markdown "$file")"
                escaped_run="$(escape_markdown "$run_name")"
                echo "| ${icon} | \`${escaped_file}\` | \`${escaped_run}\` |"
              done
              echo
            fi

            if [ -n "$error_line" ]; then
              echo "> ❌ $error_line"
              echo
            fi

            echo '<details>'
            echo '<summary>Full Test Output</summary>'
            echo
            echo '```hcl'
            cat "$output_file"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: OpenTofu test result
        if: steps.test.outcome == 'failure'
        run: exit 1
